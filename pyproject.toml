[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dnsmasq-webconf"
dynamic = ["version"]
description = "Lightweight web UI for editing dnsmasq static DHCP reservations, without rewriting your config"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Akiva Miura", email = "akiva.miura@gmail.com" }]
keywords = ["dnsmasq", "dhcp", "dns", "web-ui", "network", "self-hosted"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "bottle>=0.12",
    "Jinja2>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "webtest>=3.0",
]

[project.urls]
Homepage = "https://github.com/akivajp/dnsmasq-webconf"
Repository = "https://github.com/akivajp/dnsmasq-webconf"
Issues = "https://github.com/akivajp/dnsmasq-webconf/issues"

[project.scripts]
dnsmasq-webconf = "dnsmasq_webconf.app:main"

[tool.hatch.version]
path = "dnsmasq_webconf/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["dnsmasq_webconf"]

[tool.hatch.build.targets.sdist]
include = [
    "/dnsmasq_webconf",
    "/tests",
    "/README.md",
    "/README.ja.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
