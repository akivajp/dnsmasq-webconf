name: Publish to PyPI

# タグを打つと PyPI へ公開する。
# API トークンを持たずに済むよう Trusted Publishing (OIDC) を使用する。
# 事前に PyPI 側でこのリポジトリと workflow を Trusted Publisher として登録すること。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted Publishing に必要
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build distributions
        run: |
          pip install build
          python -m build

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
