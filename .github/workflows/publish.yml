name: Publish to PyPI

# Pushing a tag publishes to PyPI.
# Uses Trusted Publishing (OIDC) so that no API token is needed.
# Register this repository and workflow as a Trusted Publisher on PyPI beforehand.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Required for Trusted Publishing
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build distributions
        run: |
          pip install build
          python -m build

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
