name: Update screenshots

# Pushing a release tag regenerates the README screenshots from demo data (#19).
# If they changed, a pull request is opened against the default branch, so the
# images can be checked before they replace the ones on the README.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Start from the default branch rather than the tag, so the pull request
      # applies cleanly even if it moved on after tagging
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install package
        run: pip install -e .

      # google-chrome is preinstalled on the ubuntu-latest runner image
      - name: Take screenshots
        run: python scripts/update-screenshot.py

      - name: Open a pull request if they changed
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
          BRANCH: update-screenshots-${{ github.run_id }}
          SOURCE: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- docs/; then
            echo "Screenshots are unchanged"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add docs/
          git commit -m "Update screenshots for $SOURCE"
          git push origin "$BRANCH"
          gh pr create --base "$BASE" --head "$BRANCH" \
            --title "Update screenshots for $SOURCE" \
            --body "Regenerated by \`scripts/update-screenshot.py\` in the *Update screenshots* workflow."
